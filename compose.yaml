# SPhoto: the API/web app plus two Immich instances (free without machine learning, paid with it)
# that share one Postgres and one Valkey. Configuration comes from .env (see .env.example).
name: sphoto

x-immich: &immich
  image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.3.3}
  restart: unless-stopped
  depends_on:
    database:
      condition: service_healthy
    valkey:
      condition: service_healthy

services:
  app:
    build: .
    image: ${APP_IMAGE:-sphoto-app:local}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - app-data:/data
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:?set STRIPE_PRICE_BASIC in .env}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:?set STRIPE_PRICE_PRO in .env}
      STRIPE_API_URL: ${STRIPE_API_URL:-}
      FREE_IMMICH_URL: ${FREE_IMMICH_URL:?set FREE_IMMICH_URL in .env}
      PAID_IMMICH_URL: ${PAID_IMMICH_URL:?set PAID_IMMICH_URL in .env}
      FREE_IMMICH_INTERNAL_URL: http://immich-free:2283
      PAID_IMMICH_INTERNAL_URL: http://immich-paid:2283
      IMMICH_ADMIN_EMAIL: ${IMMICH_ADMIN_EMAIL:?set IMMICH_ADMIN_EMAIL in .env}
      FREE_IMMICH_ADMIN_PASSWORD: ${FREE_IMMICH_ADMIN_PASSWORD:?set FREE_IMMICH_ADMIN_PASSWORD in .env}
      PAID_IMMICH_ADMIN_PASSWORD: ${PAID_IMMICH_ADMIN_PASSWORD:?set PAID_IMMICH_ADMIN_PASSWORD in .env}
      FREE_QUOTA_GB: ${FREE_QUOTA_GB:-5}
      BASIC_QUOTA_GB: ${BASIC_QUOTA_GB:-200}
      PRO_QUOTA_GB: ${PRO_QUOTA_GB:-1000}
      BASIC_PRICE_CHF: ${BASIC_PRICE_CHF:-5}
      PRO_PRICE_CHF: ${PRO_PRICE_CHF:-15}
      DELETION_GRACE_DAYS: ${DELETION_GRACE_DAYS:-14}
      CANCELLATION_GRACE_DAYS: ${CANCELLATION_GRACE_DAYS:-14}
      EXPORT_TTL_DAYS: ${EXPORT_TTL_DAYS:-7}
      EXPORT_COOLDOWN_DAYS: ${EXPORT_COOLDOWN_DAYS:-30}
      SIGNUPS_PER_HOUR: ${SIGNUPS_PER_HOUR:-5}
      LOGIN_AND_CHECKOUT_PER_HOUR: ${LOGIN_AND_CHECKOUT_PER_HOUR:-30}
      JOBS_INTERVAL_SECONDS: ${JOBS_INTERVAL_SECONDS:-300}
    depends_on:
      - immich-free
      - immich-paid

  immich-free:
    <<: *immich
    ports:
      - "${FREE_PORT:-2283}:2283"
    environment: &immich-env
      DB_HOSTNAME: database
      DB_USERNAME: immich
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_DATABASE_NAME: immich_free
      REDIS_HOSTNAME: valkey
      REDIS_DBINDEX: "0"
      IMMICH_CONFIG_FILE: /config/immich.json
    volumes:
      - free-uploads:/data
      - ./docker/immich-free.json:/config/immich.json:ro

  immich-paid:
    <<: *immich
    ports:
      - "${PAID_PORT:-2284}:2283"
    environment:
      <<: *immich-env
      DB_DATABASE_NAME: immich_paid
      REDIS_DBINDEX: "1"
    volumes:
      - paid-uploads:/data
      - ${PAID_IMMICH_CONFIG:-./docker/immich-paid.json}:/config/immich.json:ro

  # Machine learning for the paid instance (face and object search). Enable with COMPOSE_PROFILES=ml.
  ml:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.3.3}
    profiles: ["ml"]
    restart: unless-stopped
    volumes:
      - ml-cache:/cache
    deploy:
      resources:
        limits:
          memory: ${ML_MEMORY_LIMIT:-3g}

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-sphoto.sh:ro
    shm_size: 128mb
    healthcheck:
      # TCP on purpose: during first-time init Postgres only listens on its socket.
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U immich -d immich_free -c 'select 1' && PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U immich -d immich_paid -c 'select 1'"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey:
    image: docker.io/valkey/valkey:9
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  app-data:
  free-uploads:
  paid-uploads:
  database:
  ml-cache:
