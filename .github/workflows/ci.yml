name: CI

on:
  push:
    branches: [clean-tanstack, 'rebuild/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Container image and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker build --tag sphoto-app:ci .
      - name: Validate compose files
        run: |
          cp .env.example .env
          echo "DOMAIN=sphoto.example.com" >> .env
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.proxy.yaml config --quiet
          docker compose -f compose.yaml -f compose.test.yaml config --quiet
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=sphoto.example.com -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

  e2e:
    name: End-to-end journeys (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sphoto/e2e exec playwright install --with-deps chromium
      - name: Start the stack
        run: pnpm --filter @sphoto/e2e stack:up
      - name: Run the journeys
        run: pnpm --filter @sphoto/e2e test
      - name: Stack logs
        if: failure()
        run: pnpm --filter @sphoto/e2e stack:logs
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Stop the stack
        if: always()
        run: pnpm --filter @sphoto/e2e stack:down
