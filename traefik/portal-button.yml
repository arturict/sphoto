# =============================================================================
# Portal Button Injection Middleware
# Injects a floating "Portal" button into Immich pages
# =============================================================================

http:
  middlewares:
    portal-button:
      plugin:
        rewritebody:
          lastModified: true
          rewrites:
            - regex: "</body>"
              replacement: |
                <!-- SPhoto Portal Button -->
                <div id="sphoto-portal-btn" style="
                  position: fixed;
                  bottom: 16px;
                  right: 16px;
                  z-index: 99999;
                  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                ">
                  <a href="https://sphoto.ferreiracruz.com/portal" 
                     target="_blank"
                     style="
                       display: flex;
                       align-items: center;
                       gap: 6px;
                       padding: 8px 14px;
                       background: rgba(30, 30, 30, 0.85);
                       color: #e5e5e5;
                       text-decoration: none;
                       border-radius: 8px;
                       font-weight: 500;
                       font-size: 13px;
                       border: 1px solid rgba(255,255,255,0.1);
                       backdrop-filter: blur(8px);
                       transition: all 0.2s ease;
                     "
                     onmouseover="this.style.background='rgba(50,50,50,0.9)'; this.style.color='#fff';"
                     onmouseout="this.style.background='rgba(30,30,30,0.85)'; this.style.color='#e5e5e5';"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                      <polyline points="10 17 15 12 10 7"/>
                      <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Mein Konto
                  </a>
                </div>
                <script>
                  // Hide portal button on login page
                  if (window.location.pathname === '/auth/login' || window.location.pathname === '/') {
                    var btn = document.getElementById('sphoto-portal-btn');
                    if (btn) btn.style.display = 'none';
                  }
                </script>
                </body>
